version: "3.9"
services:
  wixy:
    build: .
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      WIXY_PROXY_TARGET_URL: "https://jsonplaceholder.typicode.com"
      WIXY_PROXY_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
