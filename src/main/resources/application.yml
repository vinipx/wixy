server:
  port: 8080

spring:
  ai:
    mcp:
      server:
        enabled: true
        name: "Wixy-MCP-Server"

wixy:
  wiremock:
    port: 9090
    verbose: true
    root-dir: classpath:/wiremock
  proxy:
    enabled: false
    target-url: ""
    record: false
  security:
    enabled: false
    api-key: ""

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,mappings
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    io.github.vinipx.wixy: INFO
    org.wiremock: INFO
