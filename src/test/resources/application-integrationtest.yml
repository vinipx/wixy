# Integration test profile — used when running against local Spring Boot instance
server:
  port: 0

wixy:
  wiremock:
    port: 0
    verbose: false
    root-dir: classpath:/wiremock
  proxy:
    enabled: false
    target-url: ""
    record: false
  security:
    enabled: false
    api-key: ""

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    io.github.vinipx.wixy: INFO
    org.wiremock: WARN
