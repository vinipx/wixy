<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Neutral dark background -->
  <rect width="48" height="48" rx="10" fill="#18181b"/>
  <!-- Abstract proxy arrows — request/response flow -->
  <rect x="8" y="28" width="32" height="6" rx="2" fill="#52525b"/>
  <rect x="10" y="20" width="28" height="6" rx="2" fill="#3f3f46"/>
  <rect x="12" y="12" width="24" height="6" rx="2" fill="#27272a"/>
  <!-- Cyan accent connector lines — proxy routing (brighter for dark mode) -->
  <line x1="24" y1="12" x2="24" y2="34" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3"/>
  <!-- Cyan accent dots — stub endpoints (brighter for dark mode) -->
  <circle cx="14" cy="31" r="2" fill="#22d3ee"/>
  <circle cx="24" cy="31" r="2" fill="#67e8f9"/>
  <circle cx="34" cy="31" r="2" fill="#a5f3fc"/>
</svg>
